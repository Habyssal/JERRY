[project]
name = "jerry"
version = "0.1.0"
description = "JERRY — front vocal (VAD/speaker-verif/STT/LLM front/TTS), submodule JOSS"
authors = [
    { name = "Dessarps Bastien", email = "bdessarps@myges.fr" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "lingua-language-detector>=2.2.0",
    "nemo-toolkit[asr]==3.0.0",
    "pipecat-ai[kokoro,local,silero]==1.3.0",
    "sentence-transformers==5.5.1",
    "silero-vad==6.2.1",
    "torch",
    "torchaudio",
    "websockets>=17.1",
]

[tool.uv.build-backend]
module-root = ""
module-name = "front"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
