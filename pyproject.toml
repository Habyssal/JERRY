[project]
name = "jerry"
version = "0.1.0"
description = "JERRY — front vocal (VAD/speaker-verif/STT/LLM front/TTS), submodule JOSS"
authors = [
    { name = "Dessarps Bastien", email = "bdessarps@myges.fr" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "nemo-toolkit[asr]==3.0.0",
    "pipecat-ai==1.3.0",
    "sentence-transformers==5.5.1",
    "silero-vad==6.2.1",
]

[tool.uv.build-backend]
module-root = ""
module-name = "front"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
