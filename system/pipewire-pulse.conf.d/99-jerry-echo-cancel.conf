# JERRY (front vocal) — annulation d'écho persistante entre le micro Razer
# Seiren Mini et la sortie HDMI, sans laquelle le micro capte la sortie TTS
# pendant le barge-in (hallucinations de transcription, cf. Doc/plans/Plan-JERRY.md
# LOT 1 dans le repo JOSS). Régénère les échos "jerry_echo_source"/"jerry_echo_sink"
# et les repasse par défaut à chaque démarrage de pipewire-pulse.

pulse.cmd = [
    { cmd = "load-module"
      args = "module-echo-cancel source_master=alsa_input.usb-Razer_Inc_Razer_Seiren_Mini_UC2148L03203767-00.mono-fallback sink_master=alsa_output.pci-0000_01_00.1.hdmi-stereo aec_method=webrtc source_name=jerry_echo_source sink_name=jerry_echo_sink"
      flags = [ ] }
]

context.exec = [
    { path = "pactl" args = "set-default-source jerry_echo_source" }
    { path = "pactl" args = "set-default-sink jerry_echo_sink" }
]
